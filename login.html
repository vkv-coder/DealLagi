<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>DealLagi — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue:    #1565C0;
      --blue2:   #1E88E5;
      --blue3:   #1976D2;
      --blueL:   #E3F2FD;
      --blueM:   #BBDEFB;
      --bg:      #F0F6FF;
      --card:    #FFFFFF;
      --border:  #C9DEFF;
      --text:    #0D1F3C;
      --muted:   #5A7BA8;
      --accent:  #F57F17;
      --err:     #D32F2F;
      --success: #1565C0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(21,101,192,0.10) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 90% 100%, rgba(30,136,229,0.07) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 420px; }

    /* Floating emojis */
    .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .floater  { position: absolute; font-size: 1.6rem; opacity: 0.30; animation: floatUp linear infinite; }
    .floater:nth-child(1) { left: 5%;  font-size: 1.4rem; animation-duration: 12s; animation-delay: 0s; }
    .floater:nth-child(2) { left: 15%; font-size: 2rem;   animation-duration: 16s; animation-delay: 2s; }
    .floater:nth-child(3) { left: 28%; font-size: 1.2rem; animation-duration: 10s; animation-delay: 4s; }
    .floater:nth-child(4) { left: 42%; font-size: 1.8rem; animation-duration: 14s; animation-delay: 1s; }
    .floater:nth-child(5) { left: 58%; font-size: 1.3rem; animation-duration: 11s; animation-delay: 3s; }
    .floater:nth-child(6) { left: 70%; font-size: 2rem;   animation-duration: 15s; animation-delay: 5s; }
    .floater:nth-child(7) { left: 82%; font-size: 1.5rem; animation-duration: 13s; animation-delay: 0.5s; }
    .floater:nth-child(8) { left: 92%; font-size: 1.2rem; animation-duration: 9s;  animation-delay: 2.5s; }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg);  opacity: 0; }
      10%  { opacity: 0.30; }
      90%  { opacity: 0.30; }
      100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
    }

    /* Brand */
    .brand { text-align: center; margin-bottom: 22px; animation: fadeDown 0.6s ease both; }
    .brand-logo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      box-shadow: 0 4px 20px rgba(21,101,192,0.3);
    }
    .brand-name {
      font-family: 'Baloo 2', cursive;
      font-size: 2.4rem; font-weight: 800;
      background: linear-gradient(90deg, var(--blue), var(--blue2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1;
    }
    .brand-tag {
      font-size: 0.95rem; font-weight: 700;
      font-family: 'Baloo 2', cursive;
      color: var(--accent);
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px; padding: 28px 24px;
      box-shadow: 0 4px 24px rgba(21,101,192,0.10);
      animation: fadeUp 0.6s ease 0.15s both;
    }
    .card-title { font-family: 'Baloo 2', cursive; font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .card-sub   { font-size: 0.83rem; color: var(--muted); margin-bottom: 24px; }

    /* Steps */
    .step { display: none; }
    .step.active { display: block; animation: fadeUp 0.4s ease both; }

    /* Fields */
    .field { margin-bottom: 18px; }
    label {
      display: block; font-size: 0.79rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.8px; margin-bottom: 7px;
    }
    input {
      width: 100%; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: 'Nunito', sans-serif;
      font-size: 1rem; padding: 13px 16px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: var(--muted); opacity: 0.6; }
    input:focus {
      border-color: var(--blue2);
      box-shadow: 0 0 0 3px rgba(30,136,229,0.12);
    }
    .mobile-wrap { display: flex; gap: 8px; }
    .mobile-prefix {
      background: var(--blueL); border: 1.5px solid var(--blueM);
      border-radius: 12px; color: var(--blue3); font-size: 1rem;
      padding: 13px 14px; white-space: nowrap; flex-shrink: 0;
      font-family: 'Nunito', sans-serif; font-weight: 700;
    }
    .mobile-wrap input { flex: 1; }

    /* OTP boxes */
    .otp-wrap {
      display: flex; gap: 10px; justify-content: center;
      margin-bottom: 20px;
    }
    .otp-box {
      width: 52px; height: 58px;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-family: 'Baloo 2', cursive; font-size: 1.6rem; font-weight: 700;
      text-align: center; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .otp-box:focus {
      border-color: var(--blue2);
      box-shadow: 0 0 0 3px rgba(30,136,229,0.12);
    }

    /* OTP info box */
    .otp-info {
      background: var(--blueL); border: 1px solid var(--blueM);
      border-radius: 12px; padding: 12px 16px;
      font-size: 0.83rem; color: var(--blue3);
      margin-bottom: 18px; text-align: center; line-height: 1.5;
    }
    .otp-info strong { color: var(--blue); }

    .resend-row {
      text-align: center; font-size: 0.82rem;
      color: var(--muted); margin-bottom: 18px;
    }
    .resend-row a {
      color: var(--blue2); font-weight: 700;
      text-decoration: none; cursor: pointer;
    }

    /* Error / msg */
    .msg-box {
      display: none; font-size: 0.83rem; font-weight: 600;
      margin-bottom: 14px; padding: 10px 14px;
      border-radius: 10px;
    }
    .msg-box.err  { color: var(--err);  background: #FFEBEE; border: 1px solid #FFCDD2; }
    .msg-box.info { color: var(--blue); background: var(--blueL); border: 1px solid var(--blueM); }

    /* Button */
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      border: none; border-radius: 14px; color: #fff;
      font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 700;
      padding: 15px; cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      box-shadow: 0 4px 18px rgba(21,101,192,0.35);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:hover   { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(21,101,192,0.45); }
    .btn:active  { transform: translateY(0); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-outline {
      width: 100%; background: transparent;
      border: 1.5px solid var(--border); border-radius: 14px;
      color: var(--muted); font-family: 'Baloo 2', cursive;
      font-size: 1rem; font-weight: 700; padding: 13px;
      cursor: pointer; margin-top: 10px;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-outline:hover { border-color: var(--blue2); color: var(--blue2); }

    .spinner {
      display: none; width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }

    /* Footer */
    .footer { text-align: center; margin-top: 18px; font-size: 0.78rem; color: var(--muted); animation: fadeUp 0.6s ease 0.3s both; }
    .footer a { color: var(--blue2); text-decoration: none; font-weight: 700; }

    /* Note banner - OTP disabled */
    .dev-note {
      background: #FFF8E1; border: 1px solid #FFE082;
      border-radius: 10px; padding: 10px 14px;
      font-size: 0.78rem; color: #F57F17; font-weight: 600;
      margin-bottom: 16px; text-align: center;
    }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
    @keyframes spin     { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="floaters">
  <div class="floater">🏷️</div>
  <div class="floater">💰</div>
  <div class="floater">🛒</div>
  <div class="floater">🔔</div>
  <div class="floater">💸</div>
  <div class="floater">🎯</div>
  <div class="floater">📦</div>
  <div class="floater">⚡</div>
</div>

<div class="wrap">

  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">
      <div class="logo-icon">🏷️</div>
      <div class="brand-name">DealLagi</div>
    </div>
    <div class="brand-tag">Jab deal lage, DealLagi jaage! 😄</div>
  </div>

  <!-- Login Card -->
  <div class="card">
    <div class="card-title">👋 Welcome Back!</div>
    <div class="card-sub">Login to manage your deal alerts</div>

    <!-- STEP 1: Mobile -->
    <div class="step active" id="step-mobile">
      <div class="dev-note">🔧 Testing mode — OTP verification coming soon</div>
      <div id="msg1" class="msg-box"></div>
      <div class="field">
        <label>📱 Mobile Number</label>
        <div class="mobile-wrap">
          <div class="mobile-prefix">🇮🇳 +91</div>
          <input type="tel" id="inp-mobile" placeholder="98765 43210" maxlength="10" inputmode="numeric" />
        </div>
      </div>
      <button class="btn" id="btn-send" onclick="handleSendOTP()">
        <span id="btn-send-text">Continue →</span>
        <div class="spinner" id="spinner1"></div>
      </button>
    </div>

    <!-- STEP 2: OTP (hidden for now) -->
    <div class="step" id="step-otp">
      <div class="otp-info">
        OTP sent to <strong id="otp-mobile-display"></strong><br/>
        Enter the 6-digit code below
      </div>
      <div id="msg2" class="msg-box"></div>
      <div class="otp-wrap">
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" id="o1" />
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" id="o2" />
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" id="o3" />
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" id="o4" />
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" id="o5" />
        <input class="otp-box" type="tel" maxlength="1" inputmode="numeric" id="o6" />
      </div>
      <div class="resend-row">
        Didn't receive? <a onclick="resendOTP()">Resend OTP</a>
      </div>
      <button class="btn" id="btn-verify" onclick="handleVerifyOTP()">
        <span id="btn-verify-text">Verify & Login 🔓</span>
        <div class="spinner" id="spinner2"></div>
      </button>
      <button class="btn-outline" onclick="backToMobile()">← Change Number</button>
    </div>

  </div>

  <div class="footer">
    New to DealLagi? <a href="index.html">Register here</a>
  </div>

</div>

<script>
  const SUPA_URL = 'https://wrzpgultvahxbrgooibn.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndyenBndWx0dmFoeGJyZ29vaWJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Mzc2MTcsImV4cCI6MjA5MzExMzYxN30.sZM4GQiwom34d7TjeK_Jc_n8KYoC8VhI48jfq71dwb8';
  const SCHEMA   = 'deallagi';

  // OTP_ENABLED = false for testing, set true when 2Factor.in is ready
  const OTP_ENABLED = false;

  let currentMobile = '';
  let generatedOTP  = '';

  function showMsg(id, msg, type = 'err') {
    const el = document.getElementById(id);
    el.textContent = msg; el.className = `msg-box ${type}`; el.style.display = 'block';
  }
  function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

  function setLoading(btn, spinner, text, on, label) {
    document.getElementById(btn).disabled = on;
    document.getElementById(text).textContent = on ? 'Please wait...' : label;
    document.getElementById(spinner).style.display = on ? 'block' : 'none';
  }

  // ── STEP 1: Send OTP (or direct login in test mode) ──────
  async function handleSendOTP() {
    hideMsg('msg1');
    const mobile = document.getElementById('inp-mobile').value.trim();
    if (!/^\d{10}$/.test(mobile)) return showMsg('msg1', 'Enter a valid 10-digit mobile number.');

    setLoading('btn-send', 'spinner1', 'btn-send-text', true, 'Continue →');

    try {
      // Check if mobile is registered
      const res = await fetch(
        `${SUPA_URL}/rest/v1/users?mobile=eq.${mobile}&select=id,name,mobile,city_id,plan`,
        { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Accept-Profile': SCHEMA } }
      );
      const data = await res.json();

      if (!data.length) {
        setLoading('btn-send', 'spinner1', 'btn-send-text', false, 'Continue →');
        return showMsg('msg1', '❌ Mobile not registered. Please register first.');
      }

      currentMobile = mobile;
      const user = data[0];

      if (!OTP_ENABLED) {
        // Testing mode — direct login
        localStorage.setItem('dl_user', JSON.stringify(user));
        setLoading('btn-send', 'spinner1', 'btn-send-text', false, 'Continue →');
        showMsg('msg1', '✅ Login successful! Redirecting...', 'info');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
      } else {
        // OTP mode — generate and send
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        await sendOTPviaSMS(mobile, generatedOTP);
        setLoading('btn-send', 'spinner1', 'btn-send-text', false, 'Continue →');
        document.getElementById('otp-mobile-display').textContent = `+91 ${mobile}`;
        document.getElementById('step-mobile').classList.remove('active');
        document.getElementById('step-otp').classList.add('active');
        document.getElementById('o1').focus();
      }

    } catch(e) {
      console.error(e);
      setLoading('btn-send', 'spinner1', 'btn-send-text', false, 'Continue →');
      showMsg('msg1', 'Network error. Please try again.');
    }
  }

  // ── Send OTP via 2Factor.in ───────────────────────────────
  async function sendOTPviaSMS(mobile, otp) {
    const API_KEY = '6aa4f7ee-371f-11f1-9800-0200cd936042';
    await fetch(`https://2factor.in/API/V1/${API_KEY}/SMS/${mobile}/${otp}/DealLagi`);
  }

  // ── STEP 2: Verify OTP ───────────────────────────────────
  async function handleVerifyOTP() {
    hideMsg('msg2');
    const entered = ['o1','o2','o3','o4','o5','o6'].map(id => document.getElementById(id).value).join('');
    if (entered.length < 6) return showMsg('msg2', 'Please enter the complete 6-digit OTP.');

    setLoading('btn-verify', 'spinner2', 'btn-verify-text', true, 'Verify & Login 🔓');

    if (entered !== generatedOTP) {
      setLoading('btn-verify', 'spinner2', 'btn-verify-text', false, 'Verify & Login 🔓');
      return showMsg('msg2', '❌ Wrong OTP. Please try again.');
    }

    // Fetch user and login
    try {
      const res = await fetch(
        `${SUPA_URL}/rest/v1/users?mobile=eq.${currentMobile}&select=id,name,mobile,city_id,plan`,
        { headers: { 'apikey': SUPA_KEY, 'Authorization': `Bearer ${SUPA_KEY}`, 'Accept-Profile': SCHEMA } }
      );
      const data = await res.json();
      localStorage.setItem('dl_user', JSON.stringify(data[0]));
      window.location.href = 'dashboard.html';
    } catch(e) {
      setLoading('btn-verify', 'spinner2', 'btn-verify-text', false, 'Verify & Login 🔓');
      showMsg('msg2', 'Network error. Please try again.');
    }
  }

  // ── OTP box auto-advance ─────────────────────────────────
  document.querySelectorAll('.otp-box').forEach((box, i, boxes) => {
    box.addEventListener('input', () => {
      if (box.value && i < boxes.length - 1) boxes[i+1].focus();
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !box.value && i > 0) boxes[i-1].focus();
    });
  });

  // ── Resend OTP ───────────────────────────────────────────
  async function resendOTP() {
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
    await sendOTPviaSMS(currentMobile, generatedOTP);
    showMsg('msg2', '✅ OTP resent!', 'info');
  }

  function backToMobile() {
    document.getElementById('step-otp').classList.remove('active');
    document.getElementById('step-mobile').classList.add('active');
    hideMsg('msg1');
  }

  // ── Auto login if already logged in ─────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('dl_user');
    if (saved) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
