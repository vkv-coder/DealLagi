<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>DealLagi — Smart Deal Alerts</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue:    #1565C0;
      --blue2:   #1E88E5;
      --blue3:   #1976D2;
      --blueL:   #E3F2FD;
      --blueM:   #BBDEFB;
      --bg:      #F0F6FF;
      --card:    #FFFFFF;
      --border:  #C9DEFF;
      --text:    #0D1F3C;
      --muted:   #5A7BA8;
      --accent:  #F57F17;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(21,101,192,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 90% 100%, rgba(30,136,229,0.07) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    /* Floating emojis */
    .floaters { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .floater  { position: absolute; font-size: 1.6rem; opacity: 0.30; animation: floatUp linear infinite; }
    .floater:nth-child(1) { left: 5%;  font-size: 1.4rem; animation-duration: 12s; animation-delay: 0s; }
    .floater:nth-child(2) { left: 15%; font-size: 2rem;   animation-duration: 16s; animation-delay: 2s; }
    .floater:nth-child(3) { left: 28%; font-size: 1.2rem; animation-duration: 10s; animation-delay: 4s; }
    .floater:nth-child(4) { left: 42%; font-size: 1.8rem; animation-duration: 14s; animation-delay: 1s; }
    .floater:nth-child(5) { left: 58%; font-size: 1.3rem; animation-duration: 11s; animation-delay: 3s; }
    .floater:nth-child(6) { left: 70%; font-size: 2rem;   animation-duration: 15s; animation-delay: 5s; }
    .floater:nth-child(7) { left: 82%; font-size: 1.5rem; animation-duration: 13s; animation-delay: 0.5s; }
    .floater:nth-child(8) { left: 92%; font-size: 1.2rem; animation-duration: 9s;  animation-delay: 2.5s; }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg);  opacity: 0; }
      10%  { opacity: 0.30; }
      90%  { opacity: 0.30; }
      100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
    }

    .wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      text-align: center;
    }

    /* Brand */
    .brand { margin-bottom: 28px; animation: fadeDown 0.6s ease both; }
    .logo-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
      margin: 0 auto 16px;
      box-shadow: 0 6px 28px rgba(21,101,192,0.35);
      animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
    }
    .brand-name {
      font-family: 'Baloo 2', cursive;
      font-size: 2.8rem; font-weight: 800;
      background: linear-gradient(90deg, var(--blue), var(--blue2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1; margin-bottom: 8px;
    }
    .brand-tag {
      font-size: 1rem; font-weight: 700;
      font-family: 'Baloo 2', cursive;
      color: var(--accent); margin-bottom: 6px;
    }
    .brand-sub {
      font-size: 0.85rem; color: var(--muted);
    }

    /* Platform pills */
    .deal-strip {
      display: flex; justify-content: center; gap: 8px;
      margin-bottom: 32px; flex-wrap: wrap;
      animation: fadeUp 0.6s ease 0.2s both;
    }
    .deal-pill {
      background: var(--blueL); border: 1px solid var(--blueM);
      border-radius: 30px; padding: 5px 13px;
      font-size: 0.78rem; color: var(--blue3); font-weight: 700;
    }

    /* Feature row */
    .features {
      display: flex; gap: 10px; margin-bottom: 32px;
      animation: fadeUp 0.6s ease 0.25s both;
    }
    .feature {
      flex: 1; background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px; padding: 14px 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(21,101,192,0.07);
    }
    .feature-icon  { font-size: 1.6rem; margin-bottom: 6px; }
    .feature-label { font-size: 0.75rem; color: var(--muted); font-weight: 700; }

    /* Buttons */
    .buttons { display: flex; flex-direction: column; gap: 14px; animation: fadeUp 0.6s ease 0.3s both; }

    .btn-signup {
      width: 100%;
      background: linear-gradient(135deg, var(--blue), var(--blue2));
      border: none; border-radius: 16px; color: #fff;
      font-family: 'Baloo 2', cursive; font-size: 1.15rem; font-weight: 700;
      padding: 17px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(21,101,192,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      text-decoration: none; display: block;
    }
    .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(21,101,192,0.5); }

    .btn-signin {
      width: 100%;
      background: var(--card);
      border: 2px solid var(--blue2);
      border-radius: 16px; color: var(--blue);
      font-family: 'Baloo 2', cursive; font-size: 1.1rem; font-weight: 700;
      padding: 15px; cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      text-decoration: none; display: block;
    }
    .btn-signin:hover { background: var(--blueL); transform: translateY(-1px); }

    .signin-note {
      font-size: 0.78rem; color: var(--muted);
      margin-top: 6px; font-style: italic;
    }

    /* Footer */
    .footer {
      text-align: center; margin-top: 28px;
      font-size: 0.75rem; color: var(--muted);
      animation: fadeUp 0.6s ease 0.4s both;
    }
    .footer a { color: var(--blue2); text-decoration: none; }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
    @keyframes pop      { from { transform: scale(0.5); opacity:0; } to { transform: scale(1); opacity:1; } }
  </style>
</head>
<body>

<div class="floaters">
  <div class="floater">🏷️</div>
  <div class="floater">💰</div>
  <div class="floater">🛒</div>
  <div class="floater">🔔</div>
  <div class="floater">💸</div>
  <div class="floater">🎯</div>
  <div class="floater">📦</div>
  <div class="floater">⚡</div>
</div>

<div class="wrap">

  <!-- Brand -->
  <div class="brand">
    <div class="logo-icon">🏷️</div>
    <div class="brand-name">DealLagi</div>
    <div class="brand-tag">Jab deal lage, DealLagi jaage! 😄</div>
    <div class="brand-sub">Smart price alerts for quick commerce</div>
  </div>

  <!-- Platforms -->
  <div class="deal-strip">
    <div class="deal-pill">🛒 Swiggy Instamart</div>
    <div class="deal-pill">⚡ Blinkit</div>
    <div class="deal-pill">🚀 Zepto</div>
  </div>

  <!-- Features -->
  <div class="features">
    <div class="feature">
      <div class="feature-icon">🔔</div>
      <div class="feature-label">Instant Alerts</div>
    </div>
    <div class="feature">
      <div class="feature-icon">💰</div>
      <div class="feature-label">Real Savings</div>
    </div>
    <div class="feature">
      <div class="feature-icon">🛒</div>
      <div class="feature-label">Various Platforms</div>
    </div>
  </div>

  <!-- Buttons -->
  <div class="buttons">
    <a href="register.html" class="btn-signup">🎉 Sign Up — It's Free!</a>

    <div>
      <a href="login.html" class="btn-signin">🔓 Sign In</a>
      <div class="signin-note">Already registered? Login here</div>
    </div>
  </div>

  <div class="footer">
    <a href="#">Terms</a> &nbsp;·&nbsp; <a href="#">Privacy Policy</a> &nbsp;·&nbsp;
    <a href="mailto:vkvcoder.support@gmail.com">Support</a>
  </div>

</div>

<script>
  // Auto redirect if already logged in
  // No auto-redirect on landing page
  // User should always see Sign Up / Sign In options
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('dl_user');
    if (saved) {
      // Show a "Go to Dashboard" button instead of auto-redirecting
      const wrap = document.querySelector('.buttons');
      const dashBtn = document.createElement('a');
      dashBtn.href = 'dashboard.html';
      dashBtn.className = 'btn-signup';
      dashBtn.style.background = 'linear-gradient(135deg, #2E7D32, #43A047)';
      dashBtn.style.marginTop = '4px';
      dashBtn.textContent = '📊 Go to My Dashboard';
      wrap.appendChild(dashBtn);
    }
  });
</script>
</body>
</html>
